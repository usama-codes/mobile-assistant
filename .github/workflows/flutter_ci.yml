name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Get Dependencies
      run: flutter pub get
      
    - name: Create dummy .env
      run: touch .env

    - name: Format
      run: dart format .
      
    - name: Analyze
      run: flutter analyze --no-fatal-infos
      
    - name: Run Tests
      run: flutter test
